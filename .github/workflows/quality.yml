name: Quality Gate

on:
  push:
    branches:
      - main
      - 'hardening/**'
      - 'migration/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability:
    name: Reliability tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-windows.txt
            requirements-windows.lock

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'Pillow>=10.0' \
            'boto3>=1.34,<2' \
            'numpy>=1.26,<2.3' \
            'pycryptodome>=3.20,<4' \
            'pyproj>=3.6' \
            'requests>=2.32' \
            'shapely>=2.0,<3' \
            'mapbox-vector-tile>=2,<3' \
            'ezdxf>=1.4.4,<2'
          python -m pip check
          python -c "import ezdxf; print('ezdxf:', ezdxf.__version__)"

      - name: Check repository hygiene
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$' | grep -v '^_bytecode/'; then
            echo 'Gegenereerde Python-cachebestanden zijn getrackt.' >&2
            exit 1
          fi
          if grep -R --line-number --include='*.py' -E 'marshal\.load(s)?[[:space:]]*\(' . \
            | grep -v './legacy_bytecode.py:'; then
            echo 'Nieuwe losse marshal bytecode-loader gevonden; gebruik legacy_bytecode.py.' >&2
            exit 1
          fi
          if grep -R --line-number --include='*.py' -E '^[[:space:]]*(from[[:space:]]+marshal[[:space:]]+import|import[[:space:]]+marshal([[:space:],]|$))' . \
            | grep -v './legacy_bytecode.py:' \
            | grep -v './tests/'; then
            echo 'Nieuwe productie-import van marshal gevonden; legacy-bytecode hoort via legacy_bytecode.py te lopen.' >&2
            exit 1
          fi

      - name: Validate legacy bytecode migration contract
        run: python tools/snapshot_legacy_api.py --check

      - name: Check release integrity
        run: python tools/check_release_integrity.py

      - name: Compile source
        run: |
          python -m compileall -q . -x '(^|/)(_bytecode|__pycache__)(/|$)'

      - name: Benchmark product template I/O
        run: python tools/benchmark_template_io.py --json

      - name: Run StreetSmart source parity tests
        env:
          SLEUFBASE_MIGRATION_SETTINGS: legacy
          SLEUFBASE_MIGRATION_STREETSMART: source
          SLEUFBASE_MIGRATION_STREETSMART_BROWSER: legacy
          SLEUFBASE_MIGRATION_STREETSMART_PANEL: legacy
          SLEUFBASE_MIGRATION_APP: legacy
        run: |
          python -m unittest tests.test_streetsmart_source_migration -v

      - name: Run full reliability suite in production migration mode
        env:
          SLEUFBASE_MIGRATION_SETTINGS: legacy
          SLEUFBASE_MIGRATION_STREETSMART: source
          SLEUFBASE_MIGRATION_STREETSMART_BROWSER: legacy
          SLEUFBASE_MIGRATION_STREETSMART_PANEL: legacy
          SLEUFBASE_MIGRATION_APP: legacy
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run full reliability suite with all-legacy rollback
        env:
          SLEUFBASE_MIGRATION_SETTINGS: legacy
          SLEUFBASE_MIGRATION_STREETSMART: legacy
          SLEUFBASE_MIGRATION_STREETSMART_BROWSER: legacy
          SLEUFBASE_MIGRATION_STREETSMART_PANEL: legacy
          SLEUFBASE_MIGRATION_APP: legacy
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
