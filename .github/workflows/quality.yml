name: Quality Gate

on:
  push:
    branches:
      - main
      - 'hardening/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reliability:
    name: Reliability tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-windows.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'Pillow>=10.0' \
            'numpy>=1.26,<2.3' \
            'pyproj>=3.6' \
            'requests>=2.32' \
            'shapely>=2.0,<3' \
            'mapbox-vector-tile>=2,<3'
          python -m pip check

      - name: Compile source
        run: |
          python -m compileall -q . -x '(^|/)(_bytecode|__pycache__)(/|$)'

      - name: Run reliability regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
