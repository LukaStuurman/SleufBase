name: Apply persistence cache hardening

on:
  push:
    branches:
      - hardening/persistence-cache
    paths:
      - '.github/workflows/apply-persistence-cache-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/persistence-cache

      - name: Apply deterministic source patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: verwachtte exact 1 match, kreeg {count}')
              file_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'streetsmart_source.py',
              'from urllib.parse import quote\n\n\nSTREETSMART_WEB_URL',
              'from urllib.parse import quote\n\nfrom .atomic_io import atomic_write_text\n\n\nSTREETSMART_WEB_URL',
          )
          replace_once(
              'streetsmart_source.py',
              '''    state_path.write_text(\n        json.dumps(payload, ensure_ascii=True, indent=2),\n        encoding="utf-8",\n    )\n    return state_path\n''',
              '''    atomic_write_text(\n        state_path,\n        json.dumps(payload, ensure_ascii=True, indent=2),\n        encoding="utf-8",\n    )\n    return state_path\n''',
          )

          replace_once(
              'settings.py',
              'from pathlib import Path\n\nfrom .source_migration import load_migrating_module\n',
              'from pathlib import Path\n\nfrom .atomic_io import atomic_write_text\nfrom .source_migration import load_migrating_module\n',
          )
          replace_once(
              'settings.py',
              '''    settings_path.write_text(\n        json.dumps(payload, ensure_ascii=False, indent=2) + "\\n",\n        encoding="utf-8",\n    )\n''',
              '''    atomic_write_text(\n        settings_path,\n        json.dumps(payload, ensure_ascii=False, indent=2) + "\\n",\n        encoding="utf-8",\n    )\n''',
          )

          replace_once(
              'kickthemap_jobs_browser.py',
              'from pyproj import Transformer\n\nfrom .ipc import send_paths_to_running_instance\n',
              'from pyproj import Transformer\n\nfrom .atomic_io import atomic_write_text\nfrom .ipc import send_paths_to_running_instance\n',
          )
          replace_once(
              'kickthemap_jobs_browser.py',
              '''        manifest_path.write_text(\n            json.dumps({"jobs": current_records}, indent=2, ensure_ascii=False),\n            encoding="utf-8",\n        )\n''',
              '''        atomic_write_text(\n            manifest_path,\n            json.dumps({"jobs": current_records}, indent=2, ensure_ascii=False),\n            encoding="utf-8",\n        )\n''',
          )

          replace_once(
              'web_tiles.py',
              '''        memory_cache_limit: int = 768,\n        retries: int = 3,\n    ) -> None:\n''',
              '''        memory_cache_limit: int = 768,\n        retries: int = 3,\n        disk_cache_limit_bytes: int = 512 * 1024 * 1024,\n    ) -> None:\n''',
          )
          replace_once(
              'web_tiles.py',
              '''        self.memory_cache_limit = max(64, int(memory_cache_limit))\n        self.retries = max(1, int(retries))\n        self.transformer = Transformer.from_crs("EPSG:28992", "EPSG:3857", always_xy=True)\n''',
              '''        self.memory_cache_limit = max(64, int(memory_cache_limit))\n        self.retries = max(1, int(retries))\n        self.disk_cache_limit_bytes = max(1, int(disk_cache_limit_bytes))\n        self._disk_cache_prune_target_bytes = max(1, int(self.disk_cache_limit_bytes * 0.90))\n        self._disk_cache_prune_interval_seconds = 300.0\n        self.transformer = Transformer.from_crs("EPSG:28992", "EPSG:3857", always_xy=True)\n''',
          )
          replace_once(
              'web_tiles.py',
              '''        self._memory_cache: OrderedDict[tuple[int, int, int], Image.Image] = OrderedDict()\n        self._memory_cache_lock = threading.RLock()\n\n    def build_tile_url''',
              '''        self._memory_cache: OrderedDict[tuple[int, int, int], Image.Image] = OrderedDict()\n        self._memory_cache_lock = threading.RLock()\n        self._disk_cache_lock = threading.RLock()\n        self._last_disk_cache_prune = 0.0\n        self._prune_disk_cache(force=True)\n\n    def build_tile_url''',
          )
          replace_once(
              'web_tiles.py',
              '''    def _write_tile_atomically(self, tile_path: Path, tile: Image.Image) -> None:\n''',
              '''    def _prune_disk_cache(self, *, force: bool = False) -> None:\n        now = time.monotonic()\n        with self._disk_cache_lock:\n            if not force and (now - self._last_disk_cache_prune) < self._disk_cache_prune_interval_seconds:\n                return\n            self._last_disk_cache_prune = now\n\n            entries: list[tuple[int, Path, int]] = []\n            total_size = 0\n            try:\n                candidates = list(self.cache_dir.glob("*.png"))\n            except OSError:\n                return\n            for path in candidates:\n                try:\n                    stat = path.stat()\n                except (FileNotFoundError, OSError):\n                    continue\n                size = max(0, int(stat.st_size))\n                total_size += size\n                entries.append((int(stat.st_mtime_ns), path, size))\n\n            if total_size <= self.disk_cache_limit_bytes:\n                return\n\n            for _mtime_ns, path, size in sorted(entries, key=lambda item: item[0]):\n                try:\n                    path.unlink(missing_ok=True)\n                except OSError:\n                    continue\n                total_size = max(0, total_size - size)\n                if total_size <= self._disk_cache_prune_target_bytes:\n                    break\n\n    def _write_tile_atomically(self, tile_path: Path, tile: Image.Image) -> None:\n''',
          )
          replace_once(
              'web_tiles.py',
              '''            tile.save(temp_path, format="PNG")\n            os.replace(temp_path, tile_path)\n        finally:\n''',
              '''            tile.save(temp_path, format="PNG")\n            os.replace(temp_path, tile_path)\n            self._prune_disk_cache()\n        finally:\n''',
          )
          PY

      - name: Commit source hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add streetsmart_source.py settings.py kickthemap_jobs_browser.py web_tiles.py
          git diff --cached --check
          git commit -m 'Maak persistente writes atomisch en begrens tegelcache'
          git push origin HEAD:hardening/persistence-cache
