name: Build SleufBase Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - agent/windows-exe-build
    paths:
      - '**.py'
      - '_bytecode/**'
      - 'assets/**'
      - 'native/**'
      - 'SleufBase.spec'
      - 'requirements-windows.txt'
      - '.github/workflows/build-windows-exe.yml'
  pull_request:
    paths:
      - '**.py'
      - '_bytecode/**'
      - 'assets/**'
      - 'native/**'
      - 'SleufBase.spec'
      - 'requirements-windows.txt'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-windows.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-windows.txt

      - name: Prepare Techbase Windows branding
        shell: pwsh
        run: |
          python prepare_windows_assets.py
          if (-not (Test-Path 'assets/techbase-logo.png')) {
            throw 'assets/techbase-logo.png ontbreekt na branding-preparatie'
          }
          if (-not (Test-Path 'assets/sleufbase_icon.ico')) {
            throw 'assets/sleufbase_icon.ico ontbreekt na branding-preparatie'
          }
          Get-Item 'assets/techbase-logo.png', 'assets/sleufbase_icon.ico' | Format-Table Name,Length

      - name: Build SleufBase.exe
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm SleufBase.spec

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/SleufBase.exe')) {
            throw 'dist/SleufBase.exe ontbreekt'
          }
          Get-Item 'dist/SleufBase.exe' | Format-List Name,Length,LastWriteTime

      - name: Runtime import smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/SleufBase.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          Write-Host "SleufBase smoke-test exitcode: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) {
            throw "SleufBase runtime smoke test faalde met exitcode $($process.ExitCode)"
          }

      - name: Upload SleufBase.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: SleufBase-Windows
          path: dist/SleufBase.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/windows-exe-build'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.1.5-windows'
          $title = 'SleufBase Windows v0.1.5'
          $notes = 'Windows build met het officiële Techbase-logo als exe-/venstericoon. De eerder aanwezige native ktk_accel.dll wordt nu daadwerkelijk meegebundeld en de frozen smoke test vereist dat de native DXF/GeoTIFF-renderer actief is. PyInstaller optimaliseert de Python-bytecode op niveau 1. Cyclomedia -> StreetSmart bearer -> PDOK fallback uit v0.1.4 blijft behouden.'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag 'dist/SleufBase.exe#SleufBase.exe' --clobber
          } else {
            gh release create $tag 'dist/SleufBase.exe#SleufBase.exe' --target '${{ github.sha }}' --title $title --notes $notes
          }
