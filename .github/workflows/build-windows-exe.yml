name: Build SleufBase Windows

on:
  workflow_dispatch:
  push:
    branches:
      - agent/windows-exe-build
    paths:
      - '**.py'
      - '_bytecode/**'
      - 'assets/**'
      - 'native/**'
      - 'installer/**'
      - 'tools/**'
      - 'SleufBase.spec'
      - 'SleufBasePortable.spec'
      - 'windows_version_info.txt'
      - 'requirements-windows.txt'
      - 'requirements-windows.lock'
      - 'WINDOWS_DEPLOYMENT.md'
      - '.github/workflows/build-windows-exe.yml'
  pull_request:
    paths:
      - '**.py'
      - '_bytecode/**'
      - 'assets/**'
      - 'native/**'
      - 'installer/**'
      - 'tools/**'
      - 'SleufBase.spec'
      - 'SleufBasePortable.spec'
      - 'windows_version_info.txt'
      - 'requirements-windows.txt'
      - 'requirements-windows.lock'
      - 'WINDOWS_DEPLOYMENT.md'
      - '.github/workflows/build-windows-exe.yml'

env:
  SLEUFBASE_RELEASE_VERSION: '0.3.35'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements-windows.txt
            requirements-windows.lock

      - name: Install locked Windows dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-windows.lock
          python -m pip check
          python -c "import tkinterdnd2; from tkinterdnd2 import TkinterDnD; print('tkinterdnd2:', tkinterdnd2.__file__)"
          python -c "import ezdxf; from packaging.version import Version; assert Version(ezdxf.__version__) >= Version('1.4.4'), ezdxf.__version__; print('ezdxf:', ezdxf.__version__)"
          python -m pip freeze --all | Sort-Object | Set-Content -Encoding utf8 'dependency-snapshot.txt'

      - name: Check release integrity
        shell: pwsh
        run: python tools/check_release_integrity.py

      - name: Verify v0.3.31 installer structure
        shell: pwsh
        run: |
          $iss = Get-Content 'installer/SleufBase.iss' -Raw
          if ($iss -notmatch '(?m)^\[Tasks\]\s*$') { throw 'Standaard [Tasks]-sectie ontbreekt' }
          if ($iss -notmatch 'Tasks:\s*desktopicon') { throw 'Desktop shortcut gebruikt de standaard desktopicon-task niet' }
          if ($iss -match '(?m)^\[Code\]\s*$') { throw 'Custom [Code]-wizardlogica mag niet terugkomen' }
          if ($iss -match 'CreateInputOptionPage|TNewCheckBox|InitializeWizard|WizardForm') { throw 'Custom wizard-controls aangetroffen' }

      - name: Prepare Windows branding
        shell: pwsh
        run: |
          python prepare_windows_assets.py
          if (-not (Test-Path 'assets/techbase-logo.png')) { throw 'assets/techbase-logo.png ontbreekt' }
          if (-not (Test-Path 'assets/sleufbase_icon.ico')) { throw 'assets/sleufbase_icon.ico ontbreekt' }
          if (-not (Test-Path 'assets/cadastral_template.dxf')) { throw 'assets/cadastral_template.dxf ontbreekt' }

      - name: Build fast professional edition
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm SleufBase.spec

      - name: Build portable edition
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm SleufBasePortable.spec

      - name: Verify packaged runtime dependencies
        shell: pwsh
        run: |
          $fastExe = 'dist/SleufBase/SleufBase.exe'
          $portableExe = 'dist/SleufBase-Portable.exe'
          if (-not (Test-Path $fastExe)) { throw "$fastExe ontbreekt" }
          if (-not (Test-Path $portableExe)) { throw "$portableExe ontbreekt" }

          $dndFiles = Get-ChildItem 'dist/SleufBase' -Recurse -File | Where-Object {
            $_.FullName -match 'tkinterdnd2' -or $_.FullName -match 'tkdnd'
          }
          if (-not $dndFiles) { throw 'tkinterdnd2/TkDnD data ontbreekt in fast Windows bundle' }
          $dndFiles | Select-Object -First 20 FullName,Length | Format-Table -AutoSize

          pyi-archive_viewer -l $portableExe | Out-File -Encoding utf8 'portable-toc.txt'
          if (-not (Select-String -Path 'portable-toc.txt' -Pattern 'tkinterdnd2' -Quiet)) {
            throw 'tkinterdnd2 ontbreekt in Portable EXE archive'
          }

      - name: Smoke test packaged executables
        shell: pwsh
        run: |
          function Invoke-SleufBaseSmokeTest {
            param(
              [Parameter(Mandatory = $true)][string]$ExePath,
              [Parameter(Mandatory = $true)][string]$TracePath,
              [Parameter(Mandatory = $true)][string]$Label
            )
            if (Test-Path $TracePath) { Remove-Item $TracePath -Force }
            $env:SLEUFBASE_SMOKE_TRACE = $TracePath
            $resolvedExe = (Resolve-Path $ExePath).Path
            $process = Start-Process -FilePath $resolvedExe -ArgumentList @('--smoke-test') -Wait -PassThru
            if (Test-Path $TracePath) {
              Write-Host "--- $Label smoke trace ---"
              Get-Content $TracePath
              Write-Host "--- einde smoke trace ---"
            }
            if ($process.ExitCode -ne 0) {
              throw "$Label smoke-test faalde met exitcode $($process.ExitCode)"
            }
            if (-not (Test-Path $TracePath) -or -not (Select-String -Path $TracePath -Pattern '^smoke:ok$' -Quiet)) {
              throw "$Label smoke-test bereikte smoke:ok niet"
            }
          }

          Invoke-SleufBaseSmokeTest `
            -ExePath 'dist/SleufBase/SleufBase.exe' `
            -TracePath (Join-Path $env:RUNNER_TEMP 'sleufbase-fast-smoke.txt') `
            -Label 'Fast SleufBase'

          Invoke-SleufBaseSmokeTest `
            -ExePath 'dist/SleufBase-Portable.exe' `
            -TracePath (Join-Path $env:RUNNER_TEMP 'sleufbase-portable-smoke.txt') `
            -Label 'Portable SleufBase'

          Remove-Item Env:SLEUFBASE_SMOKE_TRACE -ErrorAction SilentlyContinue

      - name: Package fast edition ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/SleufBase/*' -DestinationPath 'dist/SleufBase-Windows-Fast.zip' -Force
          if (-not (Test-Path 'dist/SleufBase-Windows-Fast.zip')) { throw 'Fast ZIP ontbreekt' }

      - name: Install pinned Inno Setup 6.7.1
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress --allow-downgrade
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler niet gevonden: $iscc" }
          (Get-Item $iscc).VersionInfo | Select-Object ProductVersion,FileVersion | Format-List

      - name: Build professional installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $iscc 'installer/SleufBase.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup faalde met exitcode $LASTEXITCODE" }
          if (-not (Test-Path 'dist-installer/SleufBase-Setup.exe')) { throw 'SleufBase-Setup.exe ontbreekt' }

      - name: Interactive installer UI diagnostic
        continue-on-error: true
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'SleufBase-Interactive'
          & './tools/test_installer_ui.ps1' -SetupPath 'dist-installer/SleufBase-Setup.exe' -InstallDir $installDir

      - name: Verify desktop shortcut task in compiled installer
        shell: pwsh
        run: |
          $setupExe = (Resolve-Path 'dist-installer/SleufBase-Setup.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'SleufBase-DesktopTask'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }

          $desktopDir = [Environment]::GetFolderPath('Desktop')
          $desktopShortcut = Join-Path $desktopDir 'SleufBase.lnk'
          if (Test-Path $desktopShortcut) { Remove-Item $desktopShortcut -Force }

          $installer = Start-Process -FilePath $setupExe -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/TASKS="desktopicon"',
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "Installer desktop-task test faalde met exitcode $($installer.ExitCode)"
          }

          $installedExe = Join-Path $installDir 'SleufBase.exe'
          if (-not (Test-Path $installedExe)) {
            throw "SleufBase.exe ontbreekt na desktop-task test: $installedExe"
          }
          if (-not (Test-Path $desktopShortcut)) {
            throw "Desktop-task was geselecteerd, maar snelkoppeling ontbreekt: $desktopShortcut"
          }
          Write-Host "Desktop-task test geslaagd: $desktopShortcut"
          Remove-Item $desktopShortcut -Force -ErrorAction SilentlyContinue

      - name: Install and smoke test professional installer
        shell: pwsh
        run: |
          $setupExe = (Resolve-Path 'dist-installer/SleufBase-Setup.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'SleufBase-Installed'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }

          $installer = Start-Process -FilePath $setupExe -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "SleufBase installer faalde met exitcode $($installer.ExitCode)"
          }

          $installedExe = Join-Path $installDir 'SleufBase.exe'
          if (-not (Test-Path $installedExe)) {
            throw "Geïnstalleerde SleufBase.exe ontbreekt: $installedExe"
          }

          $installedTrace = Join-Path $env:RUNNER_TEMP 'sleufbase-installed-smoke.txt'
          if (Test-Path $installedTrace) { Remove-Item $installedTrace -Force }
          $env:SLEUFBASE_SMOKE_TRACE = $installedTrace
          $installedProcess = Start-Process -FilePath $installedExe -ArgumentList @('--smoke-test') -Wait -PassThru
          if (Test-Path $installedTrace) {
            Write-Host '--- Geïnstalleerde SleufBase smoke trace ---'
            Get-Content $installedTrace
            Write-Host '--- einde smoke trace ---'
          }
          if ($installedProcess.ExitCode -ne 0) {
            throw "Geïnstalleerde SleufBase smoke-test faalde met exitcode $($installedProcess.ExitCode)"
          }
          if (-not (Test-Path $installedTrace) -or -not (Select-String -Path $installedTrace -Pattern '^smoke:ok$' -Quiet)) {
            throw 'Geïnstalleerde SleufBase smoke-test bereikte smoke:ok niet'
          }
          Remove-Item Env:SLEUFBASE_SMOKE_TRACE -ErrorAction SilentlyContinue

      - name: Generate checksums and SBOM
        shell: pwsh
        run: |
          python tools/generate_release_metadata.py release-metadata `
            'dist-installer/SleufBase-Setup.exe' `
            'dist/SleufBase-Windows-Fast.zip' `
            'dist/SleufBase-Portable.exe'
          Get-Content 'release-metadata/SHA256SUMS.txt'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SleufBase-Windows-v0.3.35
          path: |
            dist-installer/SleufBase-Setup.exe
            dist/SleufBase-Windows-Fast.zip
            dist/SleufBase-Portable.exe
            dependency-snapshot.txt
            release-metadata/SHA256SUMS.txt
            release-metadata/sbom.cdx.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/windows-exe-build'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${env:SLEUFBASE_RELEASE_VERSION}-windows"
          $title = "SleufBase Windows v${env:SLEUFBASE_RELEASE_VERSION}"
          $notes = @'
          SleufBase Windows v0.3.35

          Installerfix:
          - installerwizard is teruggezet naar dezelfde standaard Inno Setup-opbouw als de werkende v0.3.31: geen custom [Code] en geen custom wizard-controls
          - `Bureaubladsnelkoppeling maken` gebruikt weer de ingebouwde `[Tasks]`-pagina en `Tasks: desktopicon`
          - de normale knoppen en checkbox komen rechtstreeks van Inno Setup zelf
          - Inno Setup is voor deze build expliciet vastgezet op versie 6.7.1
          - blocking CI-test installeert de gecompileerde Setup.exe met de desktopicon-task geselecteerd en controleert dat de bureaubladsnelkoppeling echt wordt aangemaakt
          - de UIAutomation-kliktest blijft als extra diagnose aanwezig, maar blokkeert de release niet omdat GitHub-hosted runners geen betrouwbare interactieve Windows-desktopsessie garanderen
          - bestaande stille installer- en runtime-smoketests blijven daarnaast actief
          - SHA-256-checksums, dependency snapshot en CycloneDX-SBOM inbegrepen
          '@
          $assets = @(
            'dist-installer/SleufBase-Setup.exe#SleufBase-Setup.exe',
            'dist/SleufBase-Windows-Fast.zip#SleufBase-Windows-Fast.zip',
            'dist/SleufBase-Portable.exe#SleufBase-Portable.exe',
            'release-metadata/SHA256SUMS.txt#SHA256SUMS.txt',
            'release-metadata/sbom.cdx.json#sbom.cdx.json',
            'dependency-snapshot.txt#dependency-snapshot.txt'
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --target '${{ github.sha }}' --title $title --notes $notes
          }
