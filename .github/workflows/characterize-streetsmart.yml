name: Characterize legacy StreetSmart

on:
  push:
    branches:
      - migration/streetsmart-source

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/dump_streetsmart_legacy.py
