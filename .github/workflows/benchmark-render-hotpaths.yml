name: Benchmark render hotpaths

on:
  push:
    branches:
      - performance/render-hotpaths
    paths:
      - '.github/workflows/benchmark-render-hotpaths.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark dependencies
        run: |
          python -m pip install -q 'Pillow>=10.0' 'numpy>=1.26,<2.3' 'pyproj>=3.6' 'requests>=2.32' 'shapely>=2.0,<3' 'mapbox-vector-tile>=2,<3' 'ezdxf>=1.4.4,<2'
      - name: Compare original and optimized Python DXF loop
        env:
          PYTHONPATH: ..
        run: |
          python - <<'PY'
          from pathlib import Path
          import statistics
          import time
          from PIL import Image, ImageDraw
          from SleufBase.models import Bounds, CableFeature, DxfOverlay, ViewportTransform
          from SleufBase.renderer import MapRenderer

          features = []
          for i in range(800):
              x0 = (i % 40) * 2.0
              y0 = (i // 40) * 2.0
              pts = [(x0 + j * 0.08, y0 + ((j % 3) - 1) * 0.05) for j in range(24)]
              features.append(CableFeature(
                  feature_id=f'f{i}', source_path=Path('bench.dxf'), points=pts,
                  bounds=Bounds(min(x for x, _ in pts), min(y for _, y in pts), max(x for x, _ in pts), max(y for _, y in pts)),
                  color=(20 + i % 200, 80, 160),
              ))
          overlay = DxfOverlay(Path('bench.dxf'), features)
          transform = ViewportTransform(Bounds(0.0, -1.0, 82.0, 42.0), 1200, 800)
          renderer = MapRenderer()
          original = MapRenderer._sleufbase_original_draw_dxf_overlays_python
          optimized = MapRenderer._draw_dxf_overlays_python

          def run(method, rounds=7):
              samples = []
              for _ in range(rounds):
                  image = Image.new('RGBA', (1200, 800), (245,245,245,255))
                  draw = ImageDraw.Draw(image, 'RGBA')
                  start = time.perf_counter()
                  method(renderer, draw, transform, [overlay], {'f10','f500'}, {'f20','f600'})
                  samples.append(time.perf_counter() - start)
                  image.close()
              return statistics.median(samples)

          old = run(original)
          new = run(optimized)
          speedup = old / new if new else float('inf')
          improvement = (1.0 - new / old) * 100.0 if old else 0.0
          print(f'ORIGINAL_MEDIAN_MS={old*1000:.3f}')
          print(f'OPTIMIZED_MEDIAN_MS={new*1000:.3f}')
          print(f'SPEEDUP_X={speedup:.3f}')
          print(f'IMPROVEMENT_PERCENT={improvement:.1f}')
          PY
