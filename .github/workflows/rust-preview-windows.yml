name: Rust preview - Windows

on:
  push:
    branches:
      - 'migration/rust-*'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-preview-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rust:
    name: Test and build Rust app
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Format source for preview build
        shell: pwsh
        run: cargo fmt --manifest-path rust/Cargo.toml --all
      - name: Tests
        shell: pwsh
        run: cargo test --manifest-path rust/Cargo.toml --all-targets
      - name: Clippy report
        shell: pwsh
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets
      - name: Build release
        shell: pwsh
        run: cargo build --release --manifest-path rust/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independently audit native object exports
        shell: pwsh
        env:
          OBJECT_EXPORT_AUDIT_DIR: ${{ runner.temp }}/SleufBase-object-export-audit
          PYTHONUTF8: '1'
        run: |
          python -m pip install 'ezdxf==1.4.4'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --manifest-path rust/Cargo.toml --example export_object_fixtures -- "$env:OBJECT_EXPORT_AUDIT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & rust/target/release/sleufbase-rust.exe --settings "$env:OBJECT_EXPORT_AUDIT_DIR/cli-settings.json" --dxf "$env:OBJECT_EXPORT_AUDIT_DIR/cli-actual.dxf" rust/tests/fixtures/jobFeatures.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_native_object_exports.py "$env:OBJECT_EXPORT_AUDIT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify original Python profile references
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python -m pip install 'numpy==2.2.6' 'Pillow==11.3.0' 'shapely==2.0.7' 'requests==2.32.4' 'pyproj==3.7.1' 'mapbox-vector-tile==2.2.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/generate_profile_fixtures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- rust/tests/fixtures/profiles/reference.json rust/src/profile_unicode.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path rust/Cargo.toml --test profiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --release --manifest-path rust/Cargo.toml --example benchmark_profiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independently audit template preservation and slot edits
        shell: pwsh
        env:
          TEMPLATE_AUDIT_DIR: ${{ runner.temp }}/SleufBase-template-audit
          PYTHONUTF8: '1'
        run: |
          python tools/generate_template_fixtures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- rust/tests/fixtures/templates
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --manifest-path rust/Cargo.toml --example export_template_fixtures -- "$env:TEMPLATE_AUDIT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_native_template_edits.py "$env:TEMPLATE_AUDIT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independently compare configured CLI reports and DXF colors
        shell: pwsh
        env:
          DISCIPLINE_AUDIT_DIR: ${{ runner.temp }}/SleufBase-discipline-audit
          PYTHONUTF8: '1'
        run: |
          cargo run --manifest-path rust/Cargo.toml --example export_discipline_fixtures -- "$env:DISCIPLINE_AUDIT_DIR" "$PWD/rust/target/release/sleufbase-rust.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_native_discipline_exports.py "$env:DISCIPLINE_AUDIT_DIR"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independently audit background worker exports
        shell: pwsh
        env:
          WORKER_AUDIT_DIR: ${{ runner.temp }}/SleufBase-worker-audit
          PYTHONUTF8: '1'
        run: |
          cargo run --manifest-path rust/Cargo.toml --example export_object_fixtures -- "$env:WORKER_AUDIT_DIR/objects" --worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & rust/target/release/sleufbase-rust.exe --settings "$env:WORKER_AUDIT_DIR/objects/cli-settings.json" --dxf "$env:WORKER_AUDIT_DIR/objects/cli-actual.dxf" rust/tests/fixtures/jobFeatures.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_native_object_exports.py "$env:WORKER_AUDIT_DIR/objects"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --manifest-path rust/Cargo.toml --example export_discipline_fixtures -- "$env:WORKER_AUDIT_DIR/reports" "$PWD/rust/target/release/sleufbase-rust.exe" --worker
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_native_discipline_exports.py "$env:WORKER_AUDIT_DIR/reports"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Benchmark core allocations and time
        shell: pwsh
        run: |
          cargo run --release --manifest-path rust/Cargo.toml --example benchmark_core > rust/benchmarks-core.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload core benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: SleufBase-Rust-core-benchmarks
          path: rust/benchmarks-core.csv
      - name: Benchmark bounded raster preview
        shell: pwsh
        run: |
          cargo run --release --manifest-path rust/Cargo.toml --example benchmark_raster -- rust/tests/fixtures/rasters/large-striped.tiff > rust/benchmarks-raster.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload raster benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: SleufBase-Rust-raster-benchmark
          path: rust/benchmarks-raster.json
          if-no-files-found: error
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SleufBase-Rust-Windows-preview
          path: rust/target/release/sleufbase-rust.exe
          if-no-files-found: error
      # Exact-byte sink comparison, independent of Python/app performance.
      - name: Benchmark object export streaming
        shell: pwsh
        run: |
          cargo run --release --manifest-path rust/Cargo.toml --example benchmark_object_export > rust/benchmarks-object-export.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload object export benchmark
        uses: actions/upload-artifact@v4
        with:
          name: SleufBase-Rust-object-export-benchmark
          path: rust/benchmarks-object-export.csv
          if-no-files-found: error
