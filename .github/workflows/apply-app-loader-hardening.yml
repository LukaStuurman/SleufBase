name: Apply app loader hardening

on:
  push:
    branches:
      - hardening/ci-legacy-integrity
    paths:
      - '.github/workflows/apply-app-loader-hardening.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/ci-legacy-integrity

      - name: Patch app loader and generate runtime manifest
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          app_path = Path('app.py')
          text = app_path.read_text(encoding='utf-8')
          text = text.replace('import marshal\n', '', 1)
          old = '''def _load_cached_module() -> None:\n    cache_tag = sys.implementation.cache_tag\n    if not cache_tag:\n        raise ImportError("Python cache tag is niet beschikbaar.")\n    pyc_path = Path(__file__).with_name("_bytecode") / f"app.{cache_tag}.pyc"\n    if not pyc_path.exists():\n        raise ImportError(f"Bytecode voor app.app niet gevonden: {pyc_path}")\n    code = marshal.loads(pyc_path.read_bytes()[16:])\n    exec(code, globals())\n'''
          new = '''def _load_cached_module() -> None:\n    from .source_migration import load_migrating_module\n\n    load_migrating_module("app", globals(), __file__)\n'''
          if text.count(old) != 1:
              raise SystemExit('Verwachte app.py legacy-loader niet exact één keer gevonden')
          app_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          modules = ('app', 'settings', 'streetsmart', 'streetsmart_browser', 'streetsmart_panel')
          bytecode_dir = Path('_bytecode')
          entries = {}
          for module in modules:
              matches = sorted(bytecode_dir.glob(f'{module}.cpython-311.pyc'))
              if len(matches) != 1:
                  raise SystemExit(f'Verwachte precies één Python 3.11-bytecode voor {module}, kreeg {matches}')
              path = matches[0]
              data = path.read_bytes()
              entries[module] = {
                  'filename': path.name,
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }

          manifest = {
              'schema_version': 1,
              'hash_algorithm': 'sha256',
              'modules': entries,
          }
          (bytecode_dir / 'legacy_bytecode_manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit generated hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py _bytecode/legacy_bytecode_manifest.json
          git diff --cached --check
          git commit -m 'Centraliseer app-loader en bevries legacy SHA-256 hashes'
          git push origin HEAD:hardening/ci-legacy-integrity
